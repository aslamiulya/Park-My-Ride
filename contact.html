// part 2
// Might Errors Here

const container = document.getElementById("menuContainer");
const search = document.getElementById("search");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");
const closeModal = document.getElementById("closeModal");
const cartCount = document.getElementById("cartCount");

let cart = [];



function displayMenu(items) {

    container.innerHTML = "";

    items.forEach(item => {

        const card = document.createElement("div");

        card.className =
"bg-white rounded-lg overflow-hidden border border-gray-200 shadow-sm hover:shadow-md hover:-translate-y-1 transition duration-300";

      card.innerHTML = `

<div>

    <img
        src="${item.image}"
        alt="${item.name}"
        class="w-full h-52 object-cover">


    <div class="p-6">


        <h2 class="
            text-xl
            font-medium
            tracking-wide
            text-[#2c541d]
        ">
            ${item.name}
        </h2>


        <p class="
            text-gray-600
            text-sm
            leading-relaxed
            mt-3
        ">
            ${item.description}
        </p>


        <p class="
            text-gray-500
            text-xs
            leading-relaxed
            mt-4
        ">
            <strong>Ingredients:</strong><br>
            ${item.ingredients}
        </p>



        <div class="
            flex
            justify-between
            items-center
            mt-6
        ">


            <span class="
                text-xl
                font-medium
                text-gray-800
            ">
                $${item.price}
            </span>



            <button
                class="
                bg-[#2c541d]
                text-white
                px-5
                py-2
                rounded-lg
                font-medium
                hover:bg-green-900
                transition
                add-cart
                ">

                Add

            </button>


        </div>


    </div>

</div>

`;

        // Add to cart
        card.querySelector(".add-cart").addEventListener("click", (e) => {
            e.stopPropagation();
            addCart(item);
        });

        // Open modal when clicking the card
        card.addEventListener("click", () => openModal(item));

        container.appendChild(card);

    });

}

// ===============================
// CART
// ===============================

function addCart(item){


const existing = cart.find(
product => product.name === item.name
);


if(existing){

existing.quantity++;

}

else{

cart.push({

...item,
quantity:1

});

}


updateCart();


}

// ===============================
// MODAL
// ===============================

function openModal(item) {

    modalContent.innerHTML = `

        <img
            src="${item.image}"
            class="w-full h-64 object-cover rounded-xl mb-5">

        <span class="bg-text- text-[#2c541d] px-3 py-1 rounded-full">
            ${item.category}
        </span>

        <h2 class="text-3xl font-bold mt-4">
            ${item.name}
        </h2>

        <p class="mt-4 text-gray-700">
            ${item.description}
        </p>

        <p class="mt-5">
            <strong>Ingredients:</strong><br>
            ${item.ingredients}
        </p>

        <h3 class="text-2xl font-bold mt-6 text-white">
            $${item.price}
        </h3>

    `;

    modal.classList.remove("hidden");
    modal.classList.add("flex");

}

// Close Modal
closeModal.addEventListener("click", () => {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
});

// Close when clicking outside
modal.addEventListener("click", (e) => {
    if (e.target === modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }
});

// ===============================
// SEARCH
// ===============================

search.addEventListener("input", () => {

    const value = search.value.toLowerCase();

  const filtered = menuItems.filter(item =>
    item.name.toLowerCase().includes(value) ||
    item.description.toLowerCase().includes(value) ||
    item.ingredients.toLowerCase().includes(value)
);
    displayMenu(filtered);

});

// ===============================
// CATEGORY FILTERS
// ===============================

const filterButtons = document.querySelectorAll(".filter");

filterButtons.forEach(button => {

    button.addEventListener("click", () => {

        // Active button styling
        filterButtons.forEach(btn => {
            btn.classList.remove("bg-yellow-400", "text-black");
            btn.classList.add("bg-neutral-800", "text-white");
        });

        button.classList.remove("bg-neutral-800", "text-white");
        button.classList.add("bg-yellow-400", "text-black");

        const category = button.dataset.category;

        if (category === "All") {

            displayMenu(menuItems);

        } else {

            const filtered = menuItems.filter(item =>
                item.category === category
            );

            displayMenu(filtered);

        }

    });

});
function updateCart(){


const cartItems =
document.getElementById("cartItems");


cartItems.innerHTML="";


let total=0;



cart.forEach((item,index)=>{


total +=
Number(item.price) *
item.quantity;



cartItems.innerHTML += `


<div class="
border-b
pb-4">


<h3 class="font-semibold">

${item.name}

</h3>


<div class="flex justify-between mt-2">


<div>


<button
onclick="changeQuantity(${index},-1)"
class="px-2 bg-gray-200">

-

</button>


<span class="mx-3">

${item.quantity}

</span>



<button
onclick="changeQuantity(${index},1)"
class="px-2 bg-gray-200">

+

</button>


</div>



<button
onclick="removeItem(${index})"
class="text-red-600">

Remove

</button>


</div>


</div>


`;

});


cartCount.innerText =
cart.reduce(
(sum,item)=>sum+item.quantity,
0
);



document.getElementById("cartTotal")
.innerText =
"$"+total.toFixed(2);


}
function changeQuantity(index,value){


cart[index].quantity += value;


if(cart[index].quantity <=0){

cart.splice(index,1);

}


updateCart();


}



function removeItem(index){

cart.splice(index,1);

updateCart();

}
document
.getElementById("openCart")
.onclick=()=>{

document
.getElementById("cartPanel")
.classList.remove("hidden");

};



document
.getElementById("closeCart")
.onclick=()=>{

document
.getElementById("cartPanel")
.classList.add("hidden");

};
document
.getElementById("checkoutBtn")
.onclick=()=>{


if(cart.length===0){

alert("Your cart is empty");

return;

}


alert(
"Thank you! Your order has been placed."
);


cart=[];

updateCart();


};

displayMenu(menuItems);
    </script>
