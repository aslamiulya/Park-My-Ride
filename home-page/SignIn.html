<div id="egp-page-loader" role="status" aria-live="polite" aria-label="Loading">
  <div class="egp-loader-box">
    <div class="egp-loader-badge">EGP</div>
    <span class="egp-loader-ring" aria-hidden="true"></span>

<style>
  #egp-page-loader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #egp-page-loader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .egp-loader-box {
    position: relative;
    width: 118px;
    height: 118px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .egp-loader-badge {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: #007DB5;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .egp-loader-ring {
    position: absolute;
    inset: 0;
    border: 4px solid #e6eef3;
    border-top-color: #007DB5;
    border-radius: 50%;
    animation: egp-spin 0.8s linear infinite;
  }
  @keyframes egp-spin {
    to { transform: rotate(360deg); }
  }
</style>
<script>
  (function () {
    var loader = document.getElementById("egp-page-loader");
    if (!loader) return;
    var shownAt = Date.now();
    function hide() {
      if (!loader || loader.classList.contains("is-hidden")) return;
      var wait = Math.max(0, 700 - (Date.now() - shownAt));
      setTimeout(function () {
        if (!loader || loader.classList.contains("is-hidden")) return;
        loader.classList.add("is-hidden");
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }, wait);
    }
    if (document.readyState === "complete") hide();
    else window.addEventListener("load", hide);
    setTimeout(hide, 8000);
  })();
</script>

<script>
  const RECAPTCHA_SITE_KEY = "6Le3pYEtAAAAAO-6NNAKHcr9Stgyc5SK0By3D7Jb";
  let recaptchaWidgetId = null;

  function onRecaptchaLoad() {
    const el = document.getElementById("recaptchaWidget");
    if (!el || !RECAPTCHA_SITE_KEY || RECAPTCHA_SITE_KEY === "YOUR_RECAPTCHA_SITE_KEY") return;

    recaptchaWidgetId = grecaptcha.render(el, {
      sitekey: RECAPTCHA_SITE_KEY,
      theme: "light"
    });
  }

document.addEventListener("DOMContentLoaded", () => {
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");
  const loginForm = document.getElementById("loginForm");
  const statusMessage = document.getElementById("statusMessage");
  const forgotPasswordLink = document.getElementById("forgotPasswordLink");
  const passwordBox = document.getElementById("passwordBox");
  const passwordError = document.getElementById("passwordError");

  if (forgotPasswordLink) {
    forgotPasswordLink.addEventListener("click", (e) => {
      const typedEmail = document.getElementById("email")?.value.trim() || "";
      if (!typedEmail) return;
      e.preventDefault();
      window.location.href =
        "https://eventgarageparking.net/resetpassword/?email=" +
        encodeURIComponent(typedEmail);
    });
  }

  // Helper for status messages
  function showStatus(message, type = "error") {
    if (!statusMessage) return;

    statusMessage.classList.remove("hidden");

    statusMessage.classList.remove(
      "bg-green-100",
      "text-green-700",
      "bg-red-100",
      "text-red-700"
    );

    statusMessage.classList.add(
      "rounded-lg",
      "p-3",
      "text-sm",
      "font-medium"
    );

    if (type === "success") {
      statusMessage.classList.add("bg-green-100", "text-green-700");
    } else {
      statusMessage.classList.add("bg-red-100", "text-red-700");
    }

    statusMessage.textContent = message;
  }

  function shakeEl(el) {
    if (!el) return;
    el.classList.remove("shake-x");
    void el.offsetWidth;
    el.classList.add("shake-x");
  }

  function clearPasswordError() {
    if (passwordError) passwordError.classList.add("hidden");
    if (passwordBox) passwordBox.classList.remove("password-error-box", "shake-x");
    if (passwordError) passwordError.classList.remove("shake-x");
  }

  function showIncorrectPassword() {
    if (statusMessage) statusMessage.classList.add("hidden");
    if (passwordError) {
      passwordError.textContent = "Incorrect password";
      passwordError.classList.remove("hidden");
      shakeEl(passwordError);
    }
    if (passwordBox) {
      passwordBox.classList.add("password-error-box");
      shakeEl(passwordBox);
    }
    if (passwordInput) passwordInput.focus();
  }

  function isWrongPasswordError(response, data) {
    const status = response?.status;
    if (status === 401 || status === 404) return true;
    const text = JSON.stringify(data || {}).toLowerCase();
    return /invalid|incorrect|password|credentials|unauthorized|not found/.test(
      text
    );
  }

  // Password Toggle
  if (togglePassword && passwordInput) {
    const eyeIcon = togglePassword.querySelector("i");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";

      if (eyeIcon) {
        eyeIcon.classList.toggle("fa-eye");
        eyeIcon.classList.toggle("fa-eye-slash");
      }
    });
  }

  // Login Form
  if (loginForm) {
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email")?.value.trim() || "";
      const password = passwordInput?.value.trim() || "";

      clearPasswordError();

      if (!email || !password) {
        showStatus("Please enter both email and password.");
        return;
      }

      if (!RECAPTCHA_SITE_KEY || RECAPTCHA_SITE_KEY === "YOUR_RECAPTCHA_SITE_KEY") {
        showStatus("reCAPTCHA is not configured. Add your Google site key first.");
        return;
      }

      const recaptchaToken =
        typeof grecaptcha !== "undefined"
          ? grecaptcha.getResponse(recaptchaWidgetId ?? undefined)
          : "";

      if (!recaptchaToken) {
        showStatus("Please complete the reCAPTCHA check.");
        return;
      }

      const submitButton = loginForm.querySelector('button[type="submit"]');
      if (!submitButton) return;

      const originalText = submitButton.innerHTML;

      submitButton.disabled = true;
      submitButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Logging in...';

      try {
        const response = await fetch(
          "https://eventgarageparking.online/api/home-owners/login/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json"
            },
            body: JSON.stringify({
              email,
              password,
              recaptcha_token: recaptchaToken
            })
          }
        );

        let data = null;

        try {
          data = await response.json();
        } catch (err) {
          console.warn("Response was not valid JSON.");
        }

        console.log("Login Response:", data);
        console.log("FULL LOGIN DATA:", JSON.stringify(data, null, 2));

        if (response.ok) {
          const newEmail = String(email || "").toLowerCase().trim();
          let mediaCache = {};
          try {
            mediaCache =
              JSON.parse(localStorage.getItem("pmr_profile_media_v1") || "{}") ||
              {};
          } catch (err) {
            mediaCache = {};
          }
          const cacheEmail = String(mediaCache._owner_email || "")
            .toLowerCase()
            .trim();
          const cacheHostId = String(mediaCache._owner_id || "").trim();
          const prevEmail = String(localStorage.getItem("pmr_login_email") || "")
            .toLowerCase()
            .trim();
          const prevHostId = String(
            localStorage.getItem("pmr_home_owner_id") || ""
          ).trim();

          // Same account → keep uploaded image cache; different account → wipe it
          const sameAccount =
            (newEmail && (newEmail === cacheEmail || newEmail === prevEmail)) ||
            (prevHostId && cacheHostId && prevHostId === cacheHostId);

          [
            "pmr_token",
            "pmr_refresh",
            "pmr_home_owner_id",
            "pmr_login_email",
            "loggedInUser",
            "user",
            "pmr_owner_patch_blocked"
          ].forEach((key) => {
            try {
              localStorage.removeItem(key);
            } catch (err) {
              /* ignore */
            }
          });

          if (!sameAccount) {
            try {
              localStorage.removeItem("pmr_profile_media_v1");
              mediaCache = {};
            } catch (err) {
              /* ignore */
            }
          }

          // Login API returns only { access, refresh } — no profile payload
          const token =
            data?.token ||
            data?.accessToken ||
            data?.access ||
            data?.data?.token ||
            data?.data?.access ||
            data?.data?.accessToken;

          if (token) {
            localStorage.setItem("pmr_token", token);
          }

          if (data?.refresh) {
            localStorage.setItem("pmr_refresh", data.refresh);
          }

          const mustChangePassword = Boolean(
            data?.must_change_password ||
              data?.user_must_change_password ||
              data?.data?.must_change_password
          );
          try {
            if (mustChangePassword) {
              sessionStorage.setItem("pmr_must_change_password", "1");
            } else {
              sessionStorage.removeItem("pmr_must_change_password");
            }
          } catch (err) {
            /* ignore */
          }

          // Keep login email for profile matching on other pages
          localStorage.setItem("pmr_login_email", email);

          // Re-tag kept media cache for this session
          if (sameAccount && mediaCache && typeof mediaCache === "object") {
            try {
              mediaCache._owner_email = newEmail || mediaCache._owner_email || "";
              localStorage.setItem(
                "pmr_profile_media_v1",
                JSON.stringify(mediaCache)
              );
            } catch (err) {
              /* ignore */
            }
          }

          // Exact username handle only — never email or full name (claims.name)
          function exactUsername(...candidates) {
            for (const raw of candidates) {
              if (raw == null) continue;
              const name = String(raw).trim();
              if (!name || name.includes("@") || /\s/.test(name)) continue;
              return name;
            }
            return "";
          }

          // Save username from login payload / JWT immediately
          // (GET /api/home-owners/ often returns 403 for homeowner tokens)
          (function saveUsernameEarly() {
            let name =
              exactUsername(
                data?.username,
                data?.user?.username,
                data?.data?.username
              ) || "";
            if (!name && token) {
              try {
                const part = token.split(".")[1];
                const claims = JSON.parse(
                  atob(part.replace(/-/g, "+").replace(/_/g, "/"))
                );
                console.log("JWT claims:", claims);
                // Do NOT use claims.name — that is often a full display name
                name =
                  exactUsername(
                    claims.username,
                    claims.preferred_username,
                    claims.user_name
                  ) || "";
                const hid =
                  claims.host_id ||
                  claims.home_owner_id ||
                  claims.homeowner_id ||
                  null;
                if (hid != null) {
                  localStorage.setItem("pmr_home_owner_id", String(hid));
                }
              } catch (e) {
                console.warn("JWT decode failed", e);
              }
            }
            if (name) {
              localStorage.setItem("loggedInUser", name);
              console.log("Saved username from login/JWT:", name);
            }
          })();

          function claimsFromJwt(jwt) {
            try {
              const part = String(jwt).split(".")[1];
              if (!part) return null;
              const json = atob(part.replace(/-/g, "+").replace(/_/g, "/"));
              return JSON.parse(json);
            } catch {
              return null;
            }
          }

          // Double checking for USERNAME
          function displayNameFromOwner(owner) {
              if (!owner || typeof owner !== "object") return "";

              const direct = exactUsername(owner.username, owner.Username);
              if (direct) return direct;

              const nested = exactUsername(
                  typeof owner.user === "object"
                      ? owner.user?.username
                      : ""
              );

              if (nested) {
                  const ownerEmail = String(owner.email || "").toLowerCase().trim();
                  const loginEmail = String(email || "").toLowerCase().trim();

                  if (!ownerEmail || ownerEmail === loginEmail)
                      return nested;
              }

              // Never use first/last name
              return "";
          }

          function hostIdFromOwner(owner) {
            return (
              owner?.host_id ||
              owner?.home_owner_id ||
              owner?.homeowner_id ||
              owner?.id ||
              null
            );
          }

          async function fetchHomeOwnerProfile(accessToken, loginEmail) {
            const claims = claimsFromJwt(accessToken) || {};
            const ids = [
              claims.host_id,
              claims.home_owner_id,
              claims.homeowner_id,
              claims.user_id,
              claims.userId,
              claims.id
            ].filter((v) => v != null && String(v).trim() !== "");

            const authHeaders = {
              "X-Auth-Token": accessToken,
              Accept: "application/json"
            };

            for (const hostId of ids) {
              try {
                const byId = await fetch(
                  `https://eventgarageparking.online/api/home-owners/${hostId}/`,
                  { method: "GET", headers: authHeaders }
                );
                if (byId.ok) {
                  const json = await byId.json();
                  return json?.data && typeof json.data === "object"
                    ? json.data
                    : json;
                }
              } catch {
                /* try next */
              }
            }

            const listRes = await fetch(
              "https://eventgarageparking.online/api/home-owners/",
              { method: "GET", headers: authHeaders }
            );
            if (!listRes.ok) return null;

            const listData = await listRes.json();
            const owners = Array.isArray(listData)
              ? listData
              : listData?.results || listData?.data || [];

            if (!owners.length) return null;

            const emailLower = String(loginEmail || "").toLowerCase().trim();
            if (emailLower) {
              const byEmail = owners.find(
                (o) => String(o?.email || "").toLowerCase().trim() === emailLower
              );
              if (byEmail) return byEmail;
            }
            return null;
          }

          // Always keep login email for later profile matching
          localStorage.setItem("pmr_login_email", email);

          function retagKeptMediaCache(hostId) {
            if (!sameAccount) return;
            try {
              const cache =
                JSON.parse(localStorage.getItem("pmr_profile_media_v1") || "{}") ||
                {};
              const hasFiles = Object.keys(cache).some((k) => k.charAt(0) !== "_");
              if (!hasFiles) return;
              cache._owner_email = newEmail || cache._owner_email || "";
              if (hostId != null && String(hostId).trim() !== "") {
                cache._owner_id = String(hostId);
              }
              localStorage.setItem(
                "pmr_profile_media_v1",
                JSON.stringify(cache)
              );
            } catch (err) {
              /* ignore */
            }
          }

          let owner = null;
          try {
            owner = token
              ? await fetchHomeOwnerProfile(token, email)
              : null;
          } catch (err) {
            console.warn("Could not load homeowner profile after login:", err);
          }

          if (owner) {
            localStorage.setItem(
              "user",
              JSON.stringify({ ...owner, email: owner.email || email })
            );
            const homeOwnerId = hostIdFromOwner(owner);
            if (homeOwnerId != null) {
              localStorage.setItem("pmr_home_owner_id", String(homeOwnerId));
            }
            retagKeptMediaCache(homeOwnerId);
            let username = displayNameFromOwner(owner);
            if (!username) {
              const claims = claimsFromJwt(token) || {};
              username = exactUsername(
                claims.username,
                claims.preferred_username,
                claims.user_name
              );
            }
            if (username) {
              localStorage.setItem("loggedInUser", username);
            }
            console.log("Saved User:", localStorage.getItem("loggedInUser"));
            console.log("Saved Home Owner ID:", homeOwnerId);
            console.log("Home Owner Profile:", owner);
          } else {
            const claims = claimsFromJwt(token) || {};
            const hostId =
              claims.host_id ||
              claims.home_owner_id ||
              claims.homeowner_id ||
              null;
            if (hostId != null) {
              localStorage.setItem("pmr_home_owner_id", String(hostId));
            }
            localStorage.setItem(
              "user",
              JSON.stringify({ email, host_id: hostId })
            );
            retagKeptMediaCache(hostId);
            const jwtUser = exactUsername(
              claims.username,
              claims.preferred_username,
              claims.user_name
            );
            if (jwtUser) {
              localStorage.setItem("loggedInUser", jwtUser);
            }
            console.warn("Profile not loaded yet; will retry on portal pages.");
          }

          console.log("Saved Token:", token);

          if (mustChangePassword) {
            showStatus("Please choose a new password to continue.", "success");
            window.location.href =
              "https://eventgarageparking.net/resetpassword/";
            return;
          }

          showStatus("Login successful! Redirecting...", "success");

          // Redirect
          window.location.href =
            "https://eventgarageparking.net/home-owner-listing-page/";

        } else {

          if (isWrongPasswordError(response, data)) {
            showIncorrectPassword();
          } else {
            const errorMessage =
              data?.message ||
              data?.error ||
              data?.errors?.email?.[0] ||
              data?.errors?.password?.[0] ||
              "Login failed. Please try again.";

            showStatus(errorMessage);
          }
          if (typeof grecaptcha !== "undefined") {
            grecaptcha.reset(recaptchaWidgetId ?? undefined);
          }

        }

      } catch (error) {

        console.error("Login Error:", error);
        showStatus("Server not reachable.");
        if (typeof grecaptcha !== "undefined") {
          grecaptcha.reset(recaptchaWidgetId ?? undefined);
        }

      } finally {

        submitButton.disabled = false;
        submitButton.innerHTML = originalText;

      }
    });
  }
});
</script>
</body>
</html>
