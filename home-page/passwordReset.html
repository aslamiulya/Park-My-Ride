<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Garage Parking - Reset Password</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />

  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700|Roboto:400,700&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-family-open-sans: "Open Sans", sans-serif;
      --font-family-roboto: "Roboto", sans-serif;
    }

    body {
      font-family: var(--font-family-open-sans);
      overflow-x: hidden;
      min-height: 100vh;
      background: radial-gradient(
        circle at bottom right,
        rgba(255, 255, 255, 0.12),
        rgba(0, 125, 181, 0.35) 35%,
        #00608a 70%,
        #004f73
      );
    }

    .input-focus:focus-within {
      border-color: #007db5;
      box-shadow: 0 0 0 3px rgba(0, 125, 181, 0.15);
    }
  </style>
</head>

<body>
  <div class="relative z-10 w-full min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[#007DB5] w-full">
      <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 py-4">

        <div class="hidden md:grid grid-cols-[1fr_auto_1fr] items-center w-full gap-4">
          <div class="flex justify-start">
            <a href="https://eventgarageparking.net/"
               class="w-[52px] h-[52px] lg:w-[58px] lg:h-[58px] border-2 border-white/90 rounded-[10px] flex items-center justify-center text-white font-bold text-[16px] lg:text-[18px] hover:bg-white/10 transition">
              EGP
            </a>
          </div>
          <div class="flex justify-center">
            <div class="text-white font-bold tracking-[1px] text-[18px] md:text-[20px] lg:text-[28px] leading-tight text-center whitespace-nowrap">
              Event Garage Parking
            </div>
          </div>
          <div class="flex justify-end items-center gap-1 text-[9px] lg:text-[11px] text-white/75 whitespace-nowrap">
            <a href="https://eventgarageparking.com/homeowner-faq/"
               target="_blank" rel="noopener noreferrer"
               class="cursor-pointer hover:text-white transition">Help</a>
            <span class="opacity-40">|</span>
            <a href="SignIn.html" class="cursor-pointer hover:text-white transition">Sign In</a>
          </div>
        </div>

        <div class="flex md:hidden flex-col items-center justify-center gap-3 text-center">
          <a href="https://eventgarageparking.net/"
             class="w-[54px] h-[54px] border-2 border-white/90 rounded-[10px] flex items-center justify-center text-white font-bold text-[16px]">
            EGP
          </a>
          <div class="text-white font-bold tracking-[1px] text-[22px] leading-tight">
            Event Garage Parking
          </div>
          <div class="flex flex-wrap justify-center gap-1 text-[10px] text-white/75">
            <a href="https://eventgarageparking.com/homeowner-faq/" target="_blank" rel="noopener noreferrer">Help</a>
            <span>|</span>
            <a href="SignIn.html">Sign In</a>
          </div>
        </div>

      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 flex items-center justify-center px-4 py-10 sm:py-12 md:py-16">

      <div class="w-full sm:w-[90%] md:w-[80%] lg:w-[60%] xl:w-[500px] bg-white rounded-[24px] p-5 sm:p-6 md:p-8 lg:p-10 shadow-[0_20px_60px_rgba(0,0,0,0.18)] flex flex-col gap-6">

        <!-- REQUEST RESET (default) -->
        <div id="requestPanel">
          <div class="mb-6">
            <p class="font-bold text-[30px] sm:text-[34px] text-gray-900" style="font-family: var(--font-family-roboto);">
              Reset Password
            </p>
            <p class="text-[16px] text-gray-500 mt-1">
              Enter your account email and we’ll send reset instructions.
            </p>
          </div>

          <form id="requestForm" class="flex flex-col gap-6" novalidate>
            <div class="flex flex-col gap-2">
              <label for="resetEmail" class="text-[15px] font-semibold text-gray-700">Email</label>
              <div class="border border-gray-300 rounded-[12px] px-4 py-[14px] flex items-center gap-[10px] input-focus transition-all">
                <input
                  type="email"
                  id="resetEmail"
                  name="email"
                  autocomplete="email"
                  placeholder="Enter your Email"
                  class="w-full outline-none border-none bg-transparent text-[16px]"
                  required />
              </div>
              <p id="requestEmailError" class="hidden text-red-600 text-sm"></p>
            </div>

            <p id="requestStatus" class="hidden text-sm"></p>

            <button
              type="submit"
              id="requestBtn"
              class="w-full bg-[#007db5] hover:bg-[#00689a] active:scale-[0.98] transition-all rounded-[12px] py-[14px] text-white font-semibold text-[16px]">
              Send reset link
            </button>

            <a href="SignIn.html" class="text-center text-[15px] text-[#007db5] hover:underline">
              Back to Sign In
            </a>
          </form>
        </div>

        <!-- SET NEW PASSWORD (when ?token= is in URL) -->
        <div id="confirmPanel" class="hidden">
          <div class="mb-6">
            <p class="font-bold text-[30px] sm:text-[34px] text-gray-900" style="font-family: var(--font-family-roboto);">
              Choose a new password
            </p>
            <p class="text-[16px] text-gray-500 mt-1">
              Enter and confirm your new password below.
            </p>
          </div>

          <form id="confirmForm" class="flex flex-col gap-5" novalidate>
            <div class="flex flex-col gap-2">
              <label for="confirmEmail" class="text-[15px] font-semibold text-gray-700">Email</label>
              <div class="border border-gray-300 rounded-[12px] px-4 py-[14px] input-focus">
                <input
                  type="email"
                  id="confirmEmail"
                  autocomplete="email"
                  placeholder="Enter your Email"
                  class="w-full outline-none bg-transparent text-[16px]"
                  required />
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label for="newPassword" class="text-[15px] font-semibold text-gray-700">New password</label>
              <div class="border border-gray-300 rounded-[12px] px-4 py-[14px] flex items-center gap-2 input-focus">
                <input
                  type="password"
                  id="newPassword"
                  autocomplete="new-password"
                  placeholder="New password"
                  class="w-full outline-none bg-transparent text-[16px]"
                  required />
                <button type="button" class="toggle-eye text-gray-500" data-target="newPassword" aria-label="Show password">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label for="confirmPassword" class="text-[15px] font-semibold text-gray-700">Confirm password</label>
              <div class="border border-gray-300 rounded-[12px] px-4 py-[14px] flex items-center gap-2 input-focus">
                <input
                  type="password"
                  id="confirmPassword"
                  autocomplete="new-password"
                  placeholder="Confirm password"
                  class="w-full outline-none bg-transparent text-[16px]"
                  required />
                <button type="button" class="toggle-eye text-gray-500" data-target="confirmPassword" aria-label="Show password">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <p id="confirmStatus" class="hidden text-sm"></p>

            <button
              type="submit"
              id="confirmBtn"
              class="w-full bg-[#007db5] hover:bg-[#00689a] active:scale-[0.98] transition-all rounded-[12px] py-[14px] text-white font-semibold text-[16px]">
              Update password
            </button>

            <a href="SignIn.html" class="text-center text-[15px] text-[#007db5] hover:underline">
              Back to Sign In
            </a>
          </form>
        </div>

        <!-- SUCCESS -->
        <div id="successPanel" class="hidden text-center py-4">
          <div class="mx-auto w-14 h-14 rounded-full bg-[#007db5]/10 text-[#007db5] flex items-center justify-center mb-4">
            <i class="fa-solid fa-check text-xl"></i>
          </div>
          <p class="font-bold text-2xl text-gray-900 mb-2" style="font-family: var(--font-family-roboto);">
            All set
          </p>
          <p id="successMessage" class="text-gray-500 text-[15px] mb-6"></p>
          <a href="SignIn.html"
             class="inline-flex bg-[#007db5] hover:bg-[#00689a] text-white font-semibold px-6 py-3 rounded-[12px] transition">
            Go to Sign In
          </a>
        </div>

      </div>
    </main>
  </div>

  <script>
    /**
     * Homeowner password reset endpoints.
     * Update these if your backend uses different paths.
     */
    const REQUEST_RESET_API =
      "https://eventgarageparking.online/api/home-owners/password-reset/";
    const CONFIRM_RESET_API =
      "https://eventgarageparking.online/api/home-owners/reset-password/";

    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get("token") || params.get("password_reset") || "";
    const emailFromUrl = params.get("email") || "";

    const requestPanel = document.getElementById("requestPanel");
    const confirmPanel = document.getElementById("confirmPanel");
    const successPanel = document.getElementById("successPanel");

    if (resetToken) {
      requestPanel.classList.add("hidden");
      confirmPanel.classList.remove("hidden");
      if (emailFromUrl) {
        document.getElementById("confirmEmail").value = emailFromUrl;
      }
    }

    document.querySelectorAll(".toggle-eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = show
          ? '<i class="fa-solid fa-eye-slash"></i>'
          : '<i class="fa-solid fa-eye"></i>';
      });
    });

    function showStatus(el, message, ok) {
      el.textContent = message;
      el.classList.remove("hidden", "text-red-600", "text-green-700");
      el.classList.add(ok ? "text-green-700" : "text-red-600");
    }

    function showSuccess(message) {
      requestPanel.classList.add("hidden");
      confirmPanel.classList.add("hidden");
      successPanel.classList.remove("hidden");
      document.getElementById("successMessage").textContent = message;
    }

    // Step 1 — request reset email
    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();
      const errEl = document.getElementById("requestEmailError");
      const statusEl = document.getElementById("requestStatus");
      const btn = document.getElementById("requestBtn");

      errEl.classList.add("hidden");
      statusEl.classList.add("hidden");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = "Enter a valid email address.";
        errEl.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        const res = await fetch(REQUEST_RESET_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({ email }),
        });

        let data = null;
        try {
          data = await res.json();
        } catch {
          data = null;
        }

        // Always show a neutral success message (don't reveal if email exists)
        if (res.ok || res.status === 200 || res.status === 201 || res.status === 202) {
          showSuccess(
            "If an account exists for that email, you’ll receive reset instructions shortly."
          );
          return;
        }

        // Backend not ready / auth required on route
        if (res.status === 403 || res.status === 404 || res.status === 405) {
          showStatus(
            statusEl,
            data?.detail ||
              "Password reset API is not available yet. Ask your backend for a public password-reset endpoint.",
            false
          );
          return;
        }

        showStatus(
          statusEl,
          data?.detail || data?.message || "Could not send reset email. Try again.",
          false
        );
      } catch (err) {
        console.error(err);
        showStatus(statusEl, "Network error. Please try again.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });

    // Step 2 — set new password with token from email link
    document.getElementById("confirmForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("confirmEmail").value.trim();
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const statusEl = document.getElementById("confirmStatus");
      const btn = document.getElementById("confirmBtn");

      statusEl.classList.add("hidden");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showStatus(statusEl, "Enter a valid email address.", false);
        return;
      }
      if (!password || password.length < 8) {
        showStatus(statusEl, "Password must be at least 8 characters.", false);
        return;
      }
      if (password !== confirm) {
        showStatus(statusEl, "Passwords do not match.", false);
        return;
      }
      if (!resetToken) {
        showStatus(statusEl, "Reset token missing. Open the link from your email.", false);
        return;
      }

      btn.disabled = true;
      btn.textContent = "Updating…";

      try {
        const res = await fetch(CONFIRM_RESET_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({
            email,
            token: resetToken,
            password_reset: resetToken,
            password,
          }),
        });

        let data = null;
        try {
          data = await res.json();
        } catch {
          data = null;
        }

        if (res.ok) {
          showSuccess("Your password has been updated. You can sign in now.");
          return;
        }

        if (res.status === 403 || res.status === 404 || res.status === 405) {
          showStatus(
            statusEl,
            data?.detail ||
              "Password reset confirm API is not available yet. Ask your backend for the reset-password endpoint.",
            false
          );
          return;
        }

        showStatus(
          statusEl,
          data?.detail || data?.message || "Could not update password. Try again.",
          false
        );
      } catch (err) {
        console.error(err);
        showStatus(statusEl, "Network error. Please try again.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
